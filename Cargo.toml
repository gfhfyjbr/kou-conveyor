[workspace]
members = ["crates/*", "apps/*"]
exclude = ["benchmarks/rust-go"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/gfhfyjbr/kou-conveyor"

[workspace.dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = { version = "1.0.154", features = ["raw_value", "arbitrary_precision"] }
memchr = "2.8.3"
sha2 = { version = "0.10.9", features = ["asm"] }
thiserror = "2.0.21"
tempfile = "3.27.0"
kou-domain = { path = "crates/kou-domain" }
kou-store = { path = "crates/kou-store" }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
