[package]
name = "kou-provider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22.1"
bytes = "1.12.1"
chrono.workspace = true
httpdate = "1.0.3"
kou-domain.workspace = true
mime = "0.3.17"
rand = "0.9.5"
regex = "1.13.1"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-native-roots", "http2", "stream", "system-proxy", "gzip"] }
serde.workspace = true
serde_json.workspace = true
sha2 = { version = "0.10.9", features = ["asm"] }
tokio = { version = "1.54.1", features = ["macros", "rt", "sync", "time"] }
tokio-util = { version = "0.7.20", features = ["rt"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["fs"] }

[dev-dependencies]
tempfile.workspace = true
flate2 = "1.1.11"
tokio = { version = "1.54.1", features = ["net", "io-util", "rt-multi-thread", "test-util"] }

[lints]
workspace = true
