<!-- deps.html: the modules go.mod requires, as a map — an Html of the genui
     plugin (examples/plugins/genui; deps.json calls the UI tool with it).
     The cockpit frames it sandboxed and gives it, through window.kou, the
     text of go.mod and the surface's /filter and /picked: filter or pick
     here and the native components follow, and the other way round; "Ask
     the agent" sends the event explain. No network, no storage: it draws
     only what it is given, in the cockpit's theme. -->
<style>
  * { box-sizing: border-box; }
  body { padding: 1px 1px 3px; }
  button { font: inherit; color: inherit; }
  /* Corners as round as the cockpit's: square, unless its appearance says. */
  :root { --r: var(--radius, 0px); --r-sm: var(--radius-sm, 0px); }
  #deps { display: flex; flex-direction: column; gap: 10px; }

  .head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; }
  .title { display: flex; align-items: baseline; gap: 8px; min-width: 0; flex: 1 1 240px; }
  .title b { font: 600 13px/1.3 var(--mono, ui-monospace, monospace); color: var(--fg); }
  .title span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font: 12px/1.3 var(--mono, ui-monospace, monospace); color: var(--fg-3); }
  .stats { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; font-size: 12px; color: var(--fg-3);
    font-variant-numeric: tabular-nums; }
  .stats b { color: var(--fg); font-weight: 600; }
  .key { display: inline-flex; align-items: center; gap: 6px; }
  .key i { width: 9px; height: 9px; border-radius: var(--r-sm); background: var(--bg-3); border: 1px solid var(--line-2); }
  .key i.direct { background: var(--accent-soft); border-color: var(--accent); }
  .match { color: var(--accent); }
  .search { flex: 0 1 220px; min-width: 140px; }
  .search input { width: 100%; padding: 5px 9px; border: 1px solid var(--line); border-radius: var(--r); outline: none;
    background: var(--bg-2); color: var(--fg); font: 12px/1.4 var(--sans, system-ui, sans-serif); }
  .search input::placeholder { color: var(--fg-4); }
  .search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  .bar { display: flex; gap: 2px; height: 8px; }
  .bar i { flex: var(--n) 1 0; min-width: 3px; border-radius: var(--r-sm); background: var(--c); opacity: .9; cursor: pointer;
    transition: opacity .15s; }
  .bar i.single { cursor: default; }
  .bar i.out { opacity: .16; }

  /* A row an owner: its name and count, then its modules. */
  .groups { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
  .group { display: grid; grid-template-columns: minmax(76px, 124px) minmax(0, 1fr); gap: 4px 10px; align-items: start;
    padding: 5px 2px; border-bottom: 1px solid var(--line); transition: opacity .15s, background-color .15s; }
  .group.hot { background: var(--bg-2); }
  .group.out { opacity: .4; }
  .label { display: flex; align-items: baseline; gap: 6px; min-width: 0; padding-top: 3px;
    font: 600 11px/1.35 var(--mono, ui-monospace, monospace); color: var(--fg-2); }
  .label .dot { flex: none; align-self: center; width: 7px; height: 7px; border-radius: var(--r-sm); background: var(--c); }
  .label .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .label .n { flex: none; font-weight: 400; color: var(--fg-4); font-variant-numeric: tabular-nums; }
  .tiles { display: flex; flex-wrap: wrap; gap: 3px; min-width: 0; }
  .tile { display: inline-flex; align-items: baseline; gap: 6px; max-width: 100%; padding: 2px 6px; cursor: pointer;
    border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--bg-3); color: var(--fg-3);
    font: 11px/1.35 var(--mono, ui-monospace, monospace); transition: opacity .15s, border-color .15s, color .15s; }
  .tile .n { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tile .v { flex: none; font-size: 10px; color: var(--fg-4); }
  .tile .v.pseudo::before { content: '#'; }
  .tile.direct { border-color: color-mix(in srgb, var(--accent) 40%, transparent); background: var(--accent-soft); color: var(--fg); }
  .tile.direct .v { color: var(--fg-3); }
  .tile:hover, .tile:focus-visible { outline: none; border-color: var(--fg-3); color: var(--fg); }
  .tile.picked { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); color: var(--fg); }
  .tile.out { opacity: .22; }
  /* Narrow, a tile names its module alone: the tip and the foot say the version. */
  @media (max-width: 759px) { .tile .v { display: none; } }
  @media (max-width: 380px) { .group { grid-template-columns: minmax(0, 1fr); } }

  .foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; min-height: 46px; padding: 8px 10px 8px 12px;
    border: 1px solid var(--line); border-radius: var(--r); background: var(--bg-2); }
  .what { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; flex: 1 1 280px; min-width: 0; }
  .what .path { font: 600 12.5px/1.4 var(--mono, ui-monospace, monospace); color: var(--fg); overflow-wrap: anywhere; }
  .what .ver { font: 12px/1.4 var(--mono, ui-monospace, monospace); color: var(--fg-2); }
  .what .kind { padding: 1px 7px; border-radius: var(--r-sm); background: var(--bg-3); color: var(--fg-3); font-size: 11px; }
  .what .kind.direct { background: var(--accent-soft); color: var(--accent); }
  .note { font-size: 12px; color: var(--fg-3); }
  .acts { display: flex; gap: 6px; margin-left: auto; }
  .act { padding: 6px 11px; border: 1px solid var(--line-2); border-radius: var(--r); background: var(--bg-3); cursor: pointer;
    font: 500 12px/1.2 var(--sans, system-ui, sans-serif); color: var(--fg); }
  .act:hover { border-color: var(--fg-4); }
  .act.primary { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
  .act:disabled { opacity: .55; cursor: default; }

  .tip { position: fixed; z-index: 2; max-width: min(380px, calc(100% - 8px)); padding: 8px 10px; pointer-events: none;
    border: 1px solid var(--line-2); border-radius: var(--r); background: var(--bg-4); color: var(--fg-2);
    font-size: 12px; line-height: 1.45; box-shadow: 0 8px 28px rgb(0 0 0 / .25); }
  .tip b { display: block; margin-bottom: 2px; font: 600 12px/1.35 var(--mono, ui-monospace, monospace); color: var(--fg);
    overflow-wrap: anywhere; }
  .tip .v { font-family: var(--mono, ui-monospace, monospace); color: var(--fg); }
  .empty { padding: 18px; text-align: center; color: var(--fg-3); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div id="deps"></div>

<script>
(() => {
  'use strict';
  const root = document.getElementById('deps');
  const el = (tag, cls, text) => {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  };
  const kou = window.kou;
  if (!kou) {
    root.append(el('div', 'empty', 'The genui plugin of kou-conveyor draws this page, with go.mod as its data.'));
    return;
  }

  // ------------------------------------------------------------ go.mod

  // parse reads the requirements of a go.mod: path, version, whether only
  // other modules need it (// indirect), and its line.
  function parse(text) {
    const mods = [];
    let module = '';
    let go = '';
    let block = '';
    const add = (spec, indirect, line) => {
      const m = /^"?([^\s"]+)"?\s+(\S+)$/.exec(spec);
      if (m) mods.push({ path: m[1], version: m[2], indirect, line });
    };
    text.split('\n').forEach((raw, i) => {
      const at = raw.indexOf('//');
      const code = (at >= 0 ? raw.slice(0, at) : raw).trim();
      const indirect = at >= 0 && /^\/\/\s*indirect\b/.test(raw.slice(at));
      let m;
      if (block) {
        if (code === ')') block = '';
        else if (block === 'require' && code) add(code, indirect, i + 1);
      } else if ((m = /^module\s+(\S+)$/.exec(code))) module = m[1].replace(/"/g, '');
      else if ((m = /^go\s+(\S+)$/.exec(code))) go = m[1];
      else if ((m = /^(\w+)\s*\($/.exec(code))) block = m[1];
      else if ((m = /^require\s+(.+)$/.exec(code))) add(m[1], indirect, i + 1);
    });
    return { module, go, mods };
  }

  // A pseudo-version names a commit, not a tag: v0.0.0-20260926152631-39ec2650adc9.
  const PSEUDO = /^(v\d+\.\d+\.\d+)-(?:(.+)\.)?(\d{14})-([0-9a-f]{12})(\+incompatible)?$/;
  function versionOf(v) {
    const m = PSEUDO.exec(v);
    if (!m) return { short: v.replace(/\+incompatible$/, '+inc'), commit: '' };
    const [, base, pre, ts, hash] = m;
    const date = `${ts.slice(0, 4)}-${ts.slice(4, 6)}-${ts.slice(6, 8)}`;
    const before = pre === '0' ? `, before ${base}` : '';
    return { short: hash.slice(0, 7), commit: `an untagged commit, ${hash}, of ${date}${before}` };
  }

  // Modules group by who keeps them: github.com/pion, golang.org/x; the
  // owners of one module each share a group.
  const HOSTS = new Set(['github.com', 'gitlab.com', 'bitbucket.org', 'codeberg.org']);
  function ownerOf(path) {
    const parts = path.split('/');
    if (HOSTS.has(parts[0]) && parts.length > 2) return parts.slice(0, 2).join('/');
    if (parts[0] === 'golang.org' && parts[1] === 'x') return 'golang.org/x';
    return parts[0];
  }
  function groupsOf(mods) {
    const by = new Map();
    for (const m of mods) {
      const key = ownerOf(m.path);
      if (!by.has(key)) by.set(key, []);
      by.get(key).push(m);
    }
    const order = (a, b) => (a.indirect - b.indirect) || a.path.localeCompare(b.path);
    const many = [];
    const one = [];
    for (const [key, list] of by) {
      if (list.length > 1) many.push({ key, label: key.replace(/^github\.com\//, ''), title: key, single: false, mods: list.sort(order) });
      else one.push(list[0]);
    }
    many.sort((a, b) => b.mods.length - a.mods.length || a.key.localeCompare(b.key));
    many.forEach((g, i) => { g.color = `var(--s${i % 6}, var(--accent))`; });
    if (one.length) {
      many.push({ key: '', label: 'others', title: 'owners of one module each', single: true, mods: one.sort(order), color: 'var(--fg-4)' });
    }
    return many;
  }
  // A tile names a module by what follows its owner; one with an owner of
  // its own, by its repository on a forge and by its whole path elsewhere.
  function labelOf(m, g) {
    if (!g.single) return m.path.slice(g.key.length + 1) || m.path;
    const parts = m.path.split('/');
    return HOSTS.has(parts[0]) && parts.length > 2 ? parts.slice(2).join('/') : m.path;
  }

  // ------------------------------------------------------------ the page

  const title = el('div', 'title');
  const titleModule = el('span');
  title.append(el('b', '', 'go.mod'), titleModule);
  const stats = el('div', 'stats');
  const match = el('span', 'match');
  const search = el('label', 'search');
  const input = el('input');
  input.type = 'search';
  input.placeholder = 'Filter modules';
  input.spellcheck = false;
  input.setAttribute('aria-label', 'Filter modules');
  search.append(input);
  const head = el('header', 'head');
  head.append(title, stats, search);
  const bar = el('div', 'bar');
  const box = el('div', 'groups');
  const foot = el('div', 'foot');
  const tip = el('div', 'tip');
  tip.hidden = true;
  root.append(head, bar, box, foot, tip);
  box.append(el('div', 'empty', 'Reading go.mod…'));

  let heard = false;
  let text = null;
  let model = null;
  let groups = [];
  const tiles = new Map(); // path → { m, g, node }
  let query = '';
  let picked = '';
  let footFor; // the tile the foot shows, null for none; undefined: draw it again

  function build() {
    tiles.clear();
    groups = model ? groupsOf(model.mods) : [];
    bar.replaceChildren();
    stats.replaceChildren();
    footFor = undefined;
    titleModule.textContent = model ? [model.module, model.go && `go ${model.go}`].filter(Boolean).join(' · ') : '';
    if (!model || !model.mods.length) {
      box.replaceChildren(el('div', 'empty', model ? 'go.mod requires no module.' : 'There is no go.mod in the workspace.'));
      return;
    }
    const direct = model.mods.filter((m) => !m.indirect).length;
    const commits = model.mods.filter((m) => versionOf(m.version).commit).length;
    const stat = (n, what, key) => {
      const s = el('span', key == null ? '' : 'key');
      if (key != null) s.append(el('i', key));
      s.append(el('b', '', String(n)), ` ${what}`);
      return s;
    };
    stats.append(stat(model.mods.length, 'modules'), stat(direct, 'direct', 'direct'), stat(model.mods.length - direct, 'indirect', ''));
    if (commits) stats.append(stat(commits, commits === 1 ? 'untagged commit' : 'untagged commits'));
    stats.append(match);

    box.replaceChildren(...groups.map((g) => {
      const node = el('section', 'group');
      node.style.setProperty('--c', g.color);
      const label = el('div', 'label');
      const directs = g.mods.filter((m) => !m.indirect).length;
      label.title = `${g.title}: ${g.mods.length} ${g.mods.length === 1 ? 'module' : 'modules'}${directs ? `, ${directs} direct` : ''}`;
      label.append(el('i', 'dot'), el('span', 'name', g.label), el('span', 'n', String(g.mods.length)));
      const list = el('div', 'tiles');
      for (const m of g.mods) {
        const t = el('button', m.indirect ? 'tile' : 'tile direct');
        t.type = 'button';
        t.dataset.path = m.path;
        const v = versionOf(m.version);
        t.append(el('span', 'n', labelOf(m, g)), el('span', v.commit ? 'v pseudo' : 'v', v.short));
        list.append(t);
        tiles.set(m.path, { m, g, node: t });
      }
      node.append(label, list);
      g.node = node;
      const seg = el('i', g.single ? 'single' : '');
      seg.style.setProperty('--n', String(g.mods.length));
      seg.style.setProperty('--c', g.color);
      seg.title = label.title;
      seg.addEventListener('pointerenter', () => node.classList.add('hot'));
      seg.addEventListener('pointerleave', () => node.classList.remove('hot'));
      if (!g.single) seg.addEventListener('click', () => setQuery(query === g.key ? '' : g.key));
      bar.append(seg);
      g.seg = seg;
      return node;
    }));
  }

  // update shows what the filter and the module picked are now.
  function update() {
    if (!model || !model.mods.length) return drawFoot();
    const terms = query.toLowerCase().split(/[\s,]+/).filter(Boolean);
    let hits = 0;
    for (const g of groups) {
      let any = false;
      for (const m of g.mods) {
        const t = tiles.get(m.path);
        const hit = !terms.length || terms.some((s) => m.path.toLowerCase().includes(s));
        t.node.classList.toggle('out', !hit);
        t.node.classList.toggle('picked', m.path === picked);
        t.node.setAttribute('aria-pressed', String(m.path === picked));
        if (hit) {
          any = true;
          hits++;
        }
      }
      g.node.classList.toggle('out', !any);
      g.seg.classList.toggle('out', !any);
    }
    match.textContent = terms.length ? `${hits} of ${model.mods.length} match` : '';
    match.hidden = !terms.length;
    drawFoot();
  }

  function drawFoot() {
    const t = tiles.get(picked);
    if (footFor === (t || null)) return;
    footFor = t || null;
    if (!t) {
      foot.replaceChildren(el('span', 'note', model?.mods.length
        ? 'Pick a module to see where go.mod requires it, and ask the agent about it.' : ''));
      return;
    }
    const { m, g } = t;
    const what = el('div', 'what');
    what.append(el('span', 'path', m.path), el('span', 'ver', m.version),
      el('span', m.indirect ? 'kind' : 'kind direct', m.indirect ? 'indirect' : 'direct'),
      el('span', 'note', g.single ? `go.mod line ${m.line}` : `go.mod line ${m.line} · one of ${g.mods.length} from ${g.key}`));
    const open = el('button', 'act', `Open go.mod:${m.line}`);
    open.type = 'button';
    open.addEventListener('click', () => kou.openFile('go.mod', m.line));
    const ask = el('button', 'act primary', 'Ask the agent');
    ask.type = 'button';
    ask.addEventListener('click', () => {
      kou.action('explain', { module: m.path, version: m.version, direct: !m.indirect });
      ask.disabled = true;
      setTimeout(() => { ask.disabled = false; }, 1200);
    });
    const acts = el('div', 'acts');
    acts.append(open, ask);
    foot.replaceChildren(what, acts);
  }

  function showTip(t) {
    const { m } = t;
    const v = versionOf(m.version);
    const version = el('div');
    version.append(el('span', 'v', m.version));
    tip.replaceChildren(el('b', '', m.path), version,
      el('div', '', m.indirect ? `Indirect: only modules it requires need it (go.mod line ${m.line}).`
        : `Direct: this module's code imports it (go.mod line ${m.line}).`));
    if (v.commit) tip.append(el('div', '', `${v.commit[0].toUpperCase()}${v.commit.slice(1)}.`));
    tip.hidden = false;
    const r = t.node.getBoundingClientRect();
    const w = tip.offsetWidth;
    const h = tip.offsetHeight;
    let top = r.bottom + 6;
    if (top + h > innerHeight - 4) top = Math.max(4, r.top - h - 6);
    tip.style.left = `${Math.max(4, Math.min(r.left, innerWidth - w - 4))}px`;
    tip.style.top = `${top}px`;
  }
  const tileAt = (target) => tiles.get(target?.closest?.('.tile')?.dataset.path);
  box.addEventListener('pointerover', (e) => {
    const t = tileAt(e.target);
    if (t) showTip(t);
    else tip.hidden = true;
  });
  box.addEventListener('pointerleave', () => { tip.hidden = true; });
  box.addEventListener('focusin', (e) => {
    const t = tileAt(e.target);
    if (t) showTip(t);
  });
  box.addEventListener('focusout', () => { tip.hidden = true; });
  box.addEventListener('click', (e) => {
    const t = tileAt(e.target);
    if (!t) return;
    picked = t.m.path;
    kou.set('/picked', picked);
    update();
  });

  function setQuery(q) {
    input.value = q;
    query = q;
    kou.set('/filter', q);
    update();
  }
  input.addEventListener('input', () => {
    query = input.value;
    kou.set('/filter', query);
    update();
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && input.value) {
      e.preventDefault();
      setQuery('');
    }
  });

  // What the surface gives: go.mod as it is now, and /filter and /picked as
  // the native components or this page set them.
  kou.on('data', (data) => {
    const next = data['/sources/mod'];
    if (!heard || next !== text) {
      heard = true;
      text = next;
      model = typeof next === 'string' ? parse(next) : null;
      build();
    }
    const filter = typeof data['/filter'] === 'string' ? data['/filter'] : '';
    if (document.activeElement !== input) {
      if (input.value !== filter) input.value = filter;
      query = filter;
    }
    picked = typeof data['/picked'] === 'string' ? data['/picked'] : '';
    update();
  });
})();
</script>
