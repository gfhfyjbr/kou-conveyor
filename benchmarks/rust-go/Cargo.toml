[package]
name = "kou-rust-go-probe"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
jemalloc = ["dep:tikv-jemallocator"]
count-alloc = []

[dependencies]
bumpalo = "=3.20.3"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
memchr = "=2.8.3"
serde = { version = "=1.0.229", features = ["derive", "rc"] }
serde_json = "=1.0.154"
tikv-jemallocator = { version = "=0.7.0", optional = true }

[profile.release]
lto = "thin"
codegen-units = 1
