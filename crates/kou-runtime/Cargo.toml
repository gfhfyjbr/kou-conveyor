[package]
name = "kou-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
kou-domain.workspace = true
kou-tools = { path = "../kou-tools" }
rquickjs = { version = "=0.14.0", default-features = false, features = ["std"] }
rustix = { version = "1.1.6", features = ["fs"] }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
base64 = "0.22.1"
tokio = { version = "1.54.1", features = ["sync"] }

[dev-dependencies]
kou-store.workspace = true
rustix = { version = "1.1.6", features = ["process"] }
tempfile.workspace = true
tokio = { version = "1.54.1", features = ["macros", "rt", "time"] }

[lints]
workspace = true
