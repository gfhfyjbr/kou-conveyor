[package]
name = "kou-canvas"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The canvas: nodes with live bodies, ports and edges, pan and zoom, and placeholders far out"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
gpui.workspace = true
kou-ui.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui_platform = { workspace = true, features = ["test-support"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }

# Renders the canvas to PNG from hidden windows: `cargo run -p kou-canvas --example gallery -- DIR`.
[[example]]
name = "gallery"
path = "examples/gallery.rs"
