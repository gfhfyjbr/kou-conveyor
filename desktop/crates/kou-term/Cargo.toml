[package]
name = "kou-term"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "A terminal pane: a pseudo-terminal, libghostty-vt and the GPUI element that draws it"

[lints]
workspace = true

[features]
# Render a terminal to an image in tests and examples.
capture = ["gpui/test-support", "gpui_platform/test-support"]

[dependencies]
anyhow.workspace = true
async-channel.workspace = true
ghostty-vt-sys = { path = "../ghostty-vt-sys" }
gpui.workspace = true
# PNG pictures from the Kitty graphics protocol; the version and features GPUI already
# builds.
image = { version = "0.25", default-features = false, features = ["png"] }
libc.workspace = true
log.workspace = true
parking_lot.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui_platform = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[[example]]
name = "term_capture"
required-features = ["capture"]
